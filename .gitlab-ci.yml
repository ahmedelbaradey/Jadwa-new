deploy_job:
    tags:
      - Jadwa
    stage: deploy
    only:
      - Test
    script:
    - rm -rf $CI_PROJECT_DIR/build/*
    - |
        
        cd "/home/gitlab-runner/jadwa"
        git switch Test 
        git stash
        git fetch --all
        git pull -f
        sudo docker compose -f docker-compose.yaml -f docker-compose.staging.yaml up --build -d
    - rm -rf $CI_PROJECT_DIR/build/*


